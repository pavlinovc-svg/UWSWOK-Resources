name: Verify docs export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm GitHub Pages files on main /docs
        run: |
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/.nojekyll
          test -f docs/organizations.json
          grep -q '/UWSWOK-Resources/assets/' docs/index.html
          echo "Static export is present for Pages source: branch main, path /docs"
