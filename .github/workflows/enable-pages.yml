name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload /docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Also keep legacy /docs source if API allows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "/repos/${{ github.repository }}/pages" \
            -f build_type='legacy' \
            -f source[branch]='main' \
            -f source[path]='/docs' || true
          gh api --method PATCH "/repos/${{ github.repository }}" \
            -f homepage='https://pavlinovc-svg.github.io/UWSWOK-Resources/' || true
          gh api "/repos/${{ github.repository }}/pages" || true
